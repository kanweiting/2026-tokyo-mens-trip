<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b7f78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tokyo Trip</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="appbar">
  <div class="appbar-title" id="appTitle">Tokyo Trip</div>
  <button class="me-btn" id="meBtn" aria-label="切換使用者"></button>
</header>

<main id="main">
  <!-- 行程 -->
  <section id="tab-plan" class="tab">
    <div class="hero" id="hero"></div>
    <div class="daytabs" id="dayTabs"></div>
    <div class="wrap">
      <div class="day-head" id="dayHead"></div>
      <ol class="tl" id="timeline"></ol>
      <div class="sec-head"><h3>我的收藏</h3><span id="favCount"></span></div>
      <div class="hscroll" id="favList"></div>
    </div>
  </section>

  <!-- 地圖 -->
  <section id="tab-map" class="tab tab-map" hidden>
    <div id="map"></div>
    <div class="map-top">
      <div class="chips" id="mapChips"></div>
      <div class="route-pill" id="routePill" hidden></div>
    </div>
    <button class="map-fab" id="locateBtn" aria-label="我在哪"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg></button>
    <div class="map-area" id="mapArea" hidden></div>
    <div class="carousel" id="carousel"></div>
  </section>

  <!-- 探索 -->
  <section id="tab-list" class="tab" hidden>
    <div class="search-bar">
      <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="搜尋店名、品項、區域…" enterkeyhint="search"></div>
      <div class="chips" id="typeChips"></div>
      <div class="filter-row">
        <select id="fArea"><option value="">📌 全部區域</option></select>
        <select id="fDay"><option value="">📅 不限日期</option></select>
        <select id="fSort"><option value="votes">🔥 熱門</option><option value="dist">🚶 離我最近</option><option value="name">🔤 名稱</option></select>
        <button class="chip" id="fFav">★ 收藏</button>
      </div>
    </div>
    <div class="wrap">
      <div class="muted small" id="listCount"></div>
      <div class="grid" id="list"></div>
    </div>
  </section>

  <!-- 統計 -->
  <section id="tab-stats" class="tab" hidden>
    <div class="wrap">
      <h2 class="page-title">候選地點總覽</h2>
      <div class="tiles" id="tiles"></div>
      <div class="panel">
        <div class="panel-head"><h3>各區候選數量</h3><span class="muted small">點長條看清單</span></div>
        <div class="legend" id="areaLegend"></div>
        <div id="chartArea" class="chart"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>類型 × 區域</h3><span class="muted small">點格子看清單</span></div>
        <div id="matrix" class="matrix"></div>
      </div>
    </div>
  </section>

  <!-- 記帳 -->
  <section id="tab-money" class="tab" hidden>
    <div class="wrap">
      <div class="money-hero" id="moneyHero"></div>
      <div class="seg" id="moneySeg">
        <button class="on" data-mview="list">明細</button><button data-mview="settle">結算</button><button data-mview="cat">分類</button>
      </div>
      <div id="moneyBody"></div>
      <div class="muted small sync" id="syncState"></div>
    </div>
    <button class="fab-add" id="addExpBtn" aria-label="新增一筆"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </section>
</main>

<nav class="tabbar" id="tabbar">
  <button data-tab="plan"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>行程</span></button>
  <button data-tab="map"><svg viewBox="0 0 24 24"><path d="M9 4L3.5 6v14L9 18l6 2 5.5-2V4L15 6 9 4z"/><path d="M9 4v14M15 6v14"/></svg><span>地圖</span></button>
  <button data-tab="list"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>探索</span></button>
  <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg><span>統計</span></button>
  <button data-tab="money"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.3"/></svg><span>記帳</span></button>
</nav>

<div class="sheet-backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
  <div class="sheet-handle"></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="tip" id="tip" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="config.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
